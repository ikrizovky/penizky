<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Penízky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one ledger column — summary first (what's left to spend), detail below; tabs switch between overview, ledger, budget, investing and settings. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f7fa;
  --ink: #111726;
  --ink-2: #485166;
  --muted: #7a8295;
  --line: #e0e4ec;
  --line-strong: #c9cfdb;
  --accent: #1b2847;
  --on-accent: #ffffff;
  --accent-soft: #e3e8f4;
  --c-income: #2a78d6;
  --c-expense: #eb6834;
  --c-invest: #6250d6;
  --c-save: #1baf7a;
  --c-debt: #eda100;
  --c-lent: #e87ba4;
  --good-text: #006300;
  --warn: #fab219;
  --crit: #d03b3b;
  --crit-soft: #fbe7e7;
  --shadow: 0 1px 2px rgba(17,23,38,.05), 0 4px 16px rgba(17,23,38,.05);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --surface: #161a22; --surface-2: #1c212b; --ink: #eef0f4; --ink-2: #b6bcc9; --muted: #868d9c;
    --line: #283040; --line-strong: #374052; --accent: #cdd6ee; --on-accent: #111726; --accent-soft: #232b3c;
    --c-income: #3987e5; --c-expense: #d95926; --c-invest: #9085e9; --c-save: #199e70; --c-debt: #c98500; --c-lent: #d55181;
    --good-text: #0ca30c; --warn: #fab219; --crit: #e66767; --crit-soft: #3a1f22;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --surface: #161a22; --surface-2: #1c212b; --ink: #eef0f4; --ink-2: #b6bcc9; --muted: #868d9c;
  --line: #283040; --line-strong: #374052; --accent: #cdd6ee; --on-accent: #111726; --accent-soft: #232b3c;
  --c-income: #3987e5; --c-expense: #d95926; --c-invest: #9085e9; --c-save: #199e70; --c-debt: #c98500; --c-lent: #d55181;
  --good-text: #0ca30c; --warn: #fab219; --crit: #e66767; --crit-soft: #3a1f22;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .amt { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.coin { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; box-shadow: inset 0 0 0 3px color-mix(in oklab, var(--accent) 70%, var(--surface)); }
.brand h1 { font-size: 20px; }
.period { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.period .lbl { min-width: 150px; text-align: center; font-weight: 600; padding: 0 6px; }
.icon-btn { width: 32px; height: 32px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--accent-soft); color: var(--ink); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 10px 12px; color: var(--ink-2); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--accent-soft); color: var(--ink); }
.btn.danger { color: var(--crit); }
.btn[data-armed="1"] { background: var(--crit); border-color: var(--crit); color: #fff; }
:focus-visible { outline: 2px solid var(--c-income); outline-offset: 2px; }

/* Banner */
.banner { margin-top: 16px; background: var(--accent); color: var(--on-accent); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; }
.banner p { margin: 0; flex: 1 1 280px; min-width: 0; }
.banner strong { font-family: var(--f-display); font-size: 15px; display: block; }
.banner form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.banner input { width: 170px; padding: 8px 10px; border-radius: 10px; border: 0; background: var(--surface); color: var(--ink); }
.banner .btn { background: var(--surface); color: var(--ink); border-color: transparent; }
.note { margin-top: 12px; color: var(--muted); font-size: 13px; }

/* Grid & cards */
main { padding-block: 20px 64px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; } .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
@media (max-width: 880px) { .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head .sub { color: var(--muted); font-size: 13px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 880px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero-num { font-family: var(--f-display); font-weight: 700; font-size: clamp(38px, 7vw, 60px); line-height: 1.02; letter-spacing: -0.03em; margin: 6px 0 8px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-num.neg { color: var(--crit); }
.hero-sub { color: var(--ink-2); font-size: 15px; }
.hero-sub b { color: var(--ink); font-weight: 600; }
.split { display: flex; height: 16px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.split span { display: block; height: 100%; min-width: 0; }
.split .free { background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 7px); }
.legend { display: grid; gap: 6px; margin-top: 12px; }
.legend-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; }
.legend-row .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend-row .v { font-variant-numeric: tabular-nums; font-weight: 500; }
.legend-row.total { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; font-weight: 600; }
.legend-row .op { color: var(--muted); }

/* Stat tiles */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 880px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.stat .k { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.stat .k i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.stat .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.stat .d { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 8px; border: 1px solid var(--line); }
.meter span { display: block; height: 100%; border-radius: 3px; }

/* Category bars */
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.bar-row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .val { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; text-align: right; }
.bar-row .val b { color: var(--ink); font-weight: 600; }
.track { grid-column: 1 / -1; position: relative; height: 10px; background: var(--surface-2); border-radius: 4px; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--c-expense); }
.track .fill.over { background: var(--crit); }
.track .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.ok { background: color-mix(in oklab, var(--c-save) 16%, var(--surface)); color: var(--good-text); }
.pill.warn { background: color-mix(in oklab, var(--warn) 22%, var(--surface)); color: var(--ink); }
.pill.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

/* Charts */
.chart { position: relative; width: 100%; min-height: 200px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .base-l { stroke: var(--line-strong); stroke-width: 1; }
.chart .hit { cursor: crosshair; }
.chart .hit rect.ht { fill: transparent; }
.chart .hit .cross { stroke: var(--ink-2); stroke-width: 1; opacity: 0; stroke-dasharray: 3 3; }
.chart .hit .dot { opacity: 0; }
.chart .hit:hover .cross, .chart .hit:hover .dot { opacity: 1; }
.chart .barhit:hover .bh { fill: var(--accent-soft); }
.chart .bh { fill: transparent; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.chart-legend span { display: inline-flex; gap: 6px; align-items: center; }
.chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart-legend i.line { height: 2px; border-radius: 1px; width: 14px; }
.chart-legend i.dash { height: 0; width: 14px; border-top: 2px dashed var(--ink-2); border-radius: 0; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.45; max-width: 260px; box-shadow: 0 6px 20px rgba(0,0,0,.18); font-variant-numeric: tabular-nums; }
.tip b { font-weight: 600; }

/* Lists */
.list { display: grid; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.click { cursor: pointer; border-radius: 8px; }
.row.click:hover { background: var(--surface-2); }
.row .t { min-width: 0; }
.row .t .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t .m { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-weight: 600; text-align: right; white-space: nowrap; }
.amt.income { color: var(--good-text); }
.dotc { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 12px; font-weight: 700; font-family: var(--f-display); }
.ty-expense { background: color-mix(in oklab, var(--c-expense) 16%, var(--surface)); color: var(--c-expense); }
.ty-income { background: color-mix(in oklab, var(--c-income) 16%, var(--surface)); color: var(--c-income); }
.ty-invest { background: color-mix(in oklab, var(--c-invest) 18%, var(--surface)); color: var(--c-invest); }
.ty-save { background: color-mix(in oklab, var(--c-save) 18%, var(--surface)); color: var(--c-save); }
.ty-debt { background: color-mix(in oklab, var(--c-debt) 24%, var(--surface)); color: color-mix(in oklab, var(--c-debt) 55%, var(--ink)); }
.ty-lent { background: color-mix(in oklab, var(--c-lent) 22%, var(--surface)); color: color-mix(in oklab, var(--c-lent) 60%, var(--ink)); }
.row .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.debt-person { border-top: 1px solid var(--line); padding: 6px 0; }
.debt-person:first-child { border-top: 0; padding-top: 0; }
.debt-person .row { padding-left: 16px; border-top: 0; }
.debt-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 6px 4px; }
.debt-head .t .n { font-weight: 600; }
.debt-head .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.debt-head .t .m { color: var(--muted); font-size: 12.5px; }
@media (max-width: 600px) { .debt-head { grid-template-columns: auto minmax(0, 1fr) auto; } .debt-head .acts { grid-column: 2 / -1; } .row .acts .btn { padding: 4px 8px; } }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: color-mix(in oklab, var(--c-lent) 24%, var(--surface)); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-family: var(--f-display); }
.split-box { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.chk input { margin-top: 3px; width: 16px; height: 16px; flex: none; }
#splitBody { display: grid; gap: 8px; }
.split-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.split-mine { text-align: right; }
.split-mine b { display: block; font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.split-people { display: grid; gap: 6px; }
.split-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 6px; }
.day-head { display: flex; justify-content: space-between; padding: 14px 4px 6px; color: var(--muted); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 16px; margin-bottom: 4px; }
.advice { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.advice li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.advice .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.advice .ic.crit { background: var(--crit-soft); color: var(--crit); }
.advice .ic.warn { background: color-mix(in oklab, var(--warn) 25%, var(--surface)); color: var(--ink); }
.advice .ic.ok { background: color-mix(in oklab, var(--c-save) 18%, var(--surface)); color: var(--good-text); }
.advice .ic.info { background: var(--accent-soft); color: var(--ink); }
.ai-card { background: linear-gradient(180deg, color-mix(in oklab, var(--c-invest) 8%, var(--surface)), var(--surface) 160px); }
.ai-card .card-head .acts { display: flex; gap: 6px; }
.ai-intro { display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.ai-intro p { margin: 0; flex: 1 1 320px; color: var(--ink-2); max-width: 70ch; }
.ai-thread { display: grid; gap: 10px; max-height: 560px; overflow-y: auto; overscroll-behavior: contain; }
.ai-thread:empty { display: none; }
.ai-q { justify-self: end; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 14px 14px 4px 14px; max-width: min(85%, 60ch); }
.ai-a { justify-self: start; background: var(--surface-2); border: 1px solid var(--line); padding: 12px 14px; border-radius: 14px 14px 14px 4px; max-width: 78ch; min-width: 0; overflow-wrap: anywhere; }
.ai-a p { margin: 0 0 8px; }
.ai-a p:last-child { margin-bottom: 0; }
.ai-a ul, .ai-a ol { margin: 4px 0 8px; padding-left: 20px; }
.ai-a li { margin: 3px 0; }
.ai-a h4 { margin: 10px 0 4px; font-family: var(--f-display); font-size: 15px; }
.ai-a h4:first-child { margin-top: 0; }
.ai-thinking { color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: no-preference) { .ai-thinking { animation: aiPulse 1.4s ease-in-out infinite; } @keyframes aiPulse { 50% { opacity: .45; } } }
.ai-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 8px; }
.ai-chips .tog { padding: 5px 12px; font-size: 12.5px; }
.ai-chips .tog:disabled { opacity: .5; cursor: default; }
.ai-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }

/* Forms */
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lab { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.in, select.in { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); min-width: 0; }
.in:focus { border-color: var(--ink-2); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.help { color: var(--muted); font-size: 12.5px; }
.seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 8px 2px; font-size: 13px; border-radius: 9px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.inline-form { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); align-items: end; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line-strong); }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }

@media (max-width: 600px) { .rule-row { grid-template-columns: minmax(0, 1fr) auto; } .rule-row .track { grid-column: 1 / -1; grid-row: 2; } }

.rule-row .track { grid-column: auto; }
.rule-row .track .fill { background: var(--c-income); }

/* Bank import */

<body>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MONTHS = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const MONTHS_GEN = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
const MONTHS_SHORT = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
const TYPES = {
  expense: { label: 'Výdaj', short: 'V' },
  income: { label: 'Příjem', short: 'P' },
  invest: { label: 'Investice', short: 'I' },
  save: { label: 'Spoření', short: 'S' },
  debt: { label: 'Dluh', short: 'D' },
};
const VIEWS = ['prehled', 'transakce', 'rozpocet', 'investice', 'dluhy', 'nastaveni'];

const DEFAULTS = () => ({
  version: 1, onboarded: false, currency: 'CZK', startDay: 1, incomePlan: 0,
  investPct: 15, savePct: 10, emergencyMonths: 6, emergencyStart: 0, investRate: 6,
  catVersion: 2,
  expenseCats: [
    { name: 'Bydlení', need: true }, { name: 'Energie a služby', need: true }, { name: 'Telefon a internet', need: true },
    { name: 'Potraviny', need: true }, { name: 'Drogerie a domácnost', need: true }, { name: 'Doprava', need: true },
    { name: 'Auto a pohonné hmoty', need: true }, { name: 'Zdraví', need: true }, { name: 'Pojištění', need: true },
    { name: 'Děti', need: true }, { name: 'Vzdělávání', need: true }, { name: 'Domácí mazlíčci', need: true },
    { name: 'Poplatky a úroky', need: true }, { name: 'Daně a úřady', need: true },
    { name: 'Restaurace a kavárny', need: false }, { name: 'Rozvoz jídla', need: false }, { name: 'Zábava', need: false },
    { name: 'Sport a fitness', need: false }, { name: 'Nákupy', need: false }, { name: 'Oblečení a obuv', need: false },
    { name: 'Elektronika', need: false }, { name: 'Předplatné', need: false }, { name: 'Cestování', need: false },
    { name: 'Krása a péče', need: false }, { name: 'Koníčky', need: false }, { name: 'Dárky', need: false },
    { name: 'Charita a dary', need: false }, { name: 'Ostatní', need: false },
  ],
  incomeCats: ['Mzda', 'Bonus a prémie', 'Vedlejší příjem', 'Podnikání', 'Pronájem', 'Úroky a dividendy', 'Prodej', 'Vratky a refundace', 'Dávky a příspěvky', 'Stipendium', 'Dary', 'Ostatní'],
  investCats: ['ETF', 'Akcie', 'Dluhopisy', 'Podílové fondy', 'Penzijní spoření (DIP)', 'Stavební spoření', 'Krypto', 'Nemovitosti', 'Ostatní'],
  budgets: {}, recurring: [], goals: [], importRules: {}, debts: [],
});

const S = {
  mode: 'loading',          // loading | demo | db | local
  target: 'local',          // where real data goes after leaving demo
  settings: DEFAULTS(), txs: [], offset: 0,
  view: 'prehled', filter: { type: 'all', cat: 'all', q: '' },
  stale: false, needsRender: false,
};
let refs = null, downloads = null;
// Outside claude.ai (the web/app edition) there is no window.claude: data lives in this browser and files download directly.
const standalone = !(window.claude && typeof window.claude.use === 'function');
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.view === 'nastaveni') scheduleRender(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Penízky jsou nainstalované.'); if (S.view === 'nastaveni') scheduleRender(); });
const isInstalled = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };

/* ---------- dates & money ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const today = () => ymd(new Date());
const dm = d => `${d.getDate()}. ${d.getMonth() + 1}.`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtCache = {};
function money(v, signed) {
  const c = S.settings.currency || 'CZK';
  const f = fmtCache[c] || (fmtCache[c] = new Intl.NumberFormat('cs-CZ', { style: 'currency', currency: c, maximumFractionDigits: 0, minimumFractionDigits: 0 }));
  const r = Math.round(v);
  const s = f.format(Math.abs(r) === 0 ? 0 : r);
  return signed && r > 0 ? '+' + s : s;
}
const compactF = new Intl.NumberFormat('cs-CZ', { notation: 'compact', maximumFractionDigits: 1 });
const compact = v => compactF.format(v);
const pct = v => `${Math.round(v)} %`;
const num = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function startDay() { return Math.min(28, Math.max(1, Math.round(S.settings.startDay) || 1)); }
function period(off) {
  const sd = startDay();
  const t = new Date(); let y = t.getFullYear(), m = t.getMonth();
  if (t.getDate() < sd) m -= 1;
  m += off;
  const start = new Date(y, m, sd, 12), end = new Date(y, m + 1, sd - 1, 12);
  const days = Math.round((end - start) / 864e5) + 1;
  const label = sd === 1 ? `${cap(MONTHS[start.getMonth()])} ${start.getFullYear()}` : `${dm(start)} – ${dm(end)} ${end.getFullYear()}`;
  const short = sd === 1 ? `${MONTHS_SHORT[start.getMonth()]}` : `${dm(start)}`;
  return { start, end, s: ymd(start), e: ymd(end), days, off, label, short };
}
function dateInPeriod(p, day) {
  const dd = Math.min(28, Math.max(1, Math.round(day) || 1));
  let d = new Date(p.start.getFullYear(), p.start.getMonth(), dd, 12);
  if (d < p.start) d = new Date(p.start.getFullYear(), p.start.getMonth() + 1, dd, 12);
  return ymd(d);
}

/* ---------- category helpers ---------- */
function catsFor(type) {
  const st = S.settings;
  if (type === 'expense') return st.expenseCats.map(c => ({ v: c.name, l: c.name }));
  if (type === 'income') return st.incomeCats.map(c => ({ v: c, l: c }));
  if (type === 'invest') return st.investCats.map(c => ({ v: c, l: c }));
  if (type === 'debt') { const open = allDebts().filter(d => d.open); return open.length ? open.map(d => ({ v: d.id, l: debtLabel(d) })) : [{ v: '', l: 'Žádný otevřený dluh' }]; }
  return [{ v: 'rezerva', l: 'Finanční rezerva' }, ...st.goals.map(g => ({ v: g.id, l: g.name }))];
}
function catName(t) {
  if (t.type === 'debt') { const d = findDebt(t.debtId || t.category); return d ? (d.dir === 'owed' ? `Vráceno od: ${d.name}` : `Splátka: ${d.name}`) : 'Dluh'; }
  if (t.type === 'save') { if (t.category === 'rezerva') return 'Finanční rezerva'; const g = S.settings.goals.find(g => g.id === t.category); return g ? g.name : 'Spoření'; }
  return t.category || 'Bez kategorie';
}
const isNeed = name => !!(S.settings.expenseCats.find(c => c.name === name) || {}).need;

/* ---------- calculations ---------- */
function stats(p) {
  const st = S.settings, td = today();
  const list = S.txs.filter(t => t.date >= p.s && t.date <= p.e);
  const bl = list.filter(t => !t.offBudget); // transfers marked "mimo rozpočet" stay listed but don't touch this period's budget
  const debts = allDebts(), dmap = {};
  debts.forEach(d => { dmap[d.id] = d; });
  const sum = type => bl.reduce((a, t) => a + (t.type === type ? (type === 'expense' ? expAmt(t) : num(t.amount)) : 0), 0);
  const income = sum('income'), expenses = sum('expense'), invested = sum('invest'), saved = sum('save');
  const debtDir = t => (dmap[t.debtId || t.category] || {}).dir;
  const debtPaid = bl.reduce((a, t) => a + (t.type === 'debt' && debtDir(t) === 'owe' ? num(t.amount) : 0), 0);
  const debtBack = bl.reduce((a, t) => a + (t.type === 'debt' && debtDir(t) === 'owed' ? num(t.amount) : 0), 0);
  const lentOut = debts.reduce((a, d) => a + (d.dir === 'owed' && d.date >= p.s && d.date <= p.e ? d.remaining : 0), 0);
  const past = p.e < td, future = p.s > td;
  const unpaid = past ? [] : (st.recurring || []).filter(r => !list.some(t => t.recurringId === r.id)).map(r => ({ ...r, due: dateInPeriod(p, r.day) }));
  if (!past) debts.filter(d => d.dir === 'owe' && d.open && num(d.monthly) > 0 && (d.date || '') <= p.e && !list.some(t => t.type === 'debt' && (t.debtId || t.category) === d.id))
    .forEach(d => unpaid.push({ id: 'debt:' + d.id, name: 'Splátka: ' + d.name, amount: Math.min(num(d.monthly), d.remaining), type: 'debt', due: dateInPeriod(p, d.day || 1) }));
  unpaid.sort((a, b) => a.due.localeCompare(b.due));
  const upcoming = unpaid.filter(r => r.type === 'expense' || r.type === 'debt').reduce((a, r) => a + num(r.amount), 0);
  const unpaidIncome = unpaid.filter(r => r.type === 'income').reduce((a, r) => a + num(r.amount), 0);
  const expectedIncome = past ? income : Math.max(num(st.incomePlan), income + unpaidIncome);
  const investTarget = expectedIncome * num(st.investPct) / 100;
  const saveTarget = expectedIncome * num(st.savePct) / 100;
  const resInvest = past ? invested : Math.max(investTarget, invested);
  const resSave = past ? saved : Math.max(saveTarget, saved);
  const spendLimit = expectedIncome - resInvest - resSave;
  const free = spendLimit - expenses - upcoming - debtPaid - lentOut;
  const daysLeft = future ? p.days : past ? 0 : Math.round((p.end - pd(td)) / 864e5) + 1;
  const byCat = {};
  bl.forEach(t => { if (t.type === 'expense') byCat[t.category] = (byCat[t.category] || 0) + expAmt(t); });
  const upByCat = {};
  unpaid.forEach(r => { if (r.type === 'expense') upByCat[r.category] = (upByCat[r.category] || 0) + num(r.amount); });
  return { list, income, expenses, invested, saved, past, future, unpaid, upcoming, unpaidIncome, expectedIncome, debts, debtPaid, debtBack, lentOut,
    investTarget, saveTarget, resInvest, resSave, spendLimit, free, daysLeft, byCat, upByCat, perDay: daysLeft > 0 ? free / daysLeft : 0 };
}
function avgMonthlyExpenses() {
  const vals = [];
  for (let o = -1; o >= -6 && vals.length < 3; o--) { const s = stats(period(o)); if (s.expenses > 0) vals.push(s.expenses); }
  if (vals.length) return vals.reduce((a, b) => a + b, 0) / vals.length;
  const cur = stats(period(0));
  return Math.max(cur.expenses + cur.upcoming, (S.settings.recurring || []).filter(r => r.type === 'expense').reduce((a, r) => a + num(r.amount), 0));
}
function allTimeSaved(cat) { return S.txs.reduce((a, t) => a + (t.type === 'save' && t.category === cat ? num(t.amount) : 0), 0); }
function emergency() {
  const cur = num(S.settings.emergencyStart) + allTimeSaved('rezerva');
  const monthly = avgMonthlyExpenses();
  const target = monthly * num(S.settings.emergencyMonths);
  return { cur, monthly, target, months: monthly > 0 ? cur / monthly : 0 };
}
function goalInfo(g) {
  const saved = num(g.start) + allTimeSaved(g.id);
  const left = Math.max(0, num(g.target) - saved);
  let months = null;
  if (g.deadline) months = Math.max(1, Math.ceil((pd(g.deadline) - pd(today())) / (30.44 * 864e5)));
  return { saved, left, months, monthly: months ? left / months : null, done: left <= 0 };
}

/* ---------- persistence ---------- */
let chain = Promise.resolve();
let settingsQueued = false, settingsInFlight = 0;
function enqueue(fn) {
  chain = chain.then(fn).catch(err => {
    console.error(err);
    toast(err && err.code === 'quota_exceeded' ? 'Úložiště je plné. Smaž staré transakce nebo exportuj zálohu.' : 'Uložení se nepovedlo. Zkus to prosím znovu.');
  });
  return chain;
}
const plain = o => JSON.parse(JSON.stringify(o));
function saveLocal() {
  try { localStorage.setItem('penizky:v1', JSON.stringify({ settings: S.settings, txs: S.txs })); }
  catch (e) { toast('Prohlížeč nedovolil data uložit.'); }
}
function persistSettings() {
  debtCache = null;
  if (S.mode === 'demo') return;
  if (S.mode === 'local') return saveLocal();
  if (S.mode !== 'db' || settingsQueued) return;
  settingsQueued = true; settingsInFlight++;
  enqueue(async () => { settingsQueued = false; try { await refs.root.set(plain(S.settings)); } finally { settingsInFlight--; } });
}
function persistTx(tx) {
  if (S.mode === 'local') return saveLocal();
  if (S.mode !== 'db') return;
  const { id, ...body } = tx;
  enqueue(() => refs.tx.doc(id).set(plain(body)));
}
function removeTxRemote(id) {
  if (S.mode === 'local') return saveLocal();
  if (S.mode !== 'db') return;
  enqueue(() => refs.tx.doc(id).delete());
}
function upsertTx(tx) {
  debtCache = null;
  const i = S.txs.findIndex(t => t.id === tx.id);
  if (i >= 0) S.txs[i] = tx; else S.txs.push(tx);
  persistTx(tx);
}
function deleteTx(id) { debtCache = null; S.txs = S.txs.filter(t => t.id !== id); removeTxRemote(id); }
// Adds the categories introduced later to settings saved before them; existing names, order and custom ones stay.
function migrateCats(st) {
  if ((st.catVersion || 1) >= 2) return false;
  const d = DEFAULTS();
  const insert = (arr, item, nameOf) => { const i = arr.findIndex(x => nameOf(x) === 'Ostatní'); if (i >= 0) arr.splice(i, 0, item); else arr.push(item); };
  d.expenseCats.forEach(c => { if (!st.expenseCats.some(x => x.name === c.name)) insert(st.expenseCats, { ...c }, x => x.name); });
  d.incomeCats.forEach(c => { if (!st.incomeCats.includes(c)) insert(st.incomeCats, c, x => x); });
  d.investCats.forEach(c => { if (!st.investCats.includes(c)) insert(st.investCats, c, x => x); });
  st.catVersion = 2;
  return true;
}
function mergeSettings(raw) {
  const d = DEFAULTS(), r = raw ? plain(raw) : {};
  const out = { ...d, ...r };
  ['expenseCats', 'incomeCats', 'investCats', 'recurring', 'goals', 'debts'].forEach(k => { if (!Array.isArray(out[k])) out[k] = d[k]; });
  if (!out.budgets || typeof out.budgets !== 'object') out.budgets = {};
  if (!out.importRules || typeof out.importRules !== 'object') out.importRules = {};
  out.catVersion = r.catVersion || 1;
  return out;
}

/* ---------- demo data ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeDemo() {
  const st = DEFAULTS();
  st.onboarded = true; st.incomePlan = 52000; st.emergencyStart = 95000;
  st.budgets = { 'Potraviny': 7000, 'Restaurace a kavárny': 2500, 'Zábava': 1500, 'Nákupy': 3000, 'Doprava': 1800 };
  st.recurring = [
    { id: 'r-mzda', name: 'Výplata', amount: 52000, type: 'income', category: 'Mzda', day: 1 },
    { id: 'r-najem', name: 'Nájem', amount: 14500, type: 'expense', category: 'Bydlení', day: 5 },
    { id: 'r-energie', name: 'Elektřina a plyn', amount: 2600, type: 'expense', category: 'Energie a služby', day: 10 },
    { id: 'r-mobil', name: 'Mobil a internet', amount: 890, type: 'expense', category: 'Energie a služby', day: 15 },
    { id: 'r-stream', name: 'Streamovací služby', amount: 399, type: 'expense', category: 'Předplatné', day: 20 },

  ];
  { const p0 = period(0), sq = ymd(new Date(p0.start.getFullYear(), p0.start.getMonth(), p0.start.getDate() + 2, 12));
    if (sq <= td) { txs.push({ id: 'd-squash', date: sq, type: 'expense', amount: 1200, category: 'Zábava', note: 'Squashový kurt', split: { people: [{ id: 'p1', name: 'Petr', amount: 300 }, { id: 'p2', name: 'Jana', amount: 300 }, { id: 'p3', name: 'Tomáš', amount: 300 }] } }); add(sq, 'debt', 300, 's:d-squash:p1', 'Vráceno: Petr'); }
    const p1 = period(-1);

/* ---------- boot ---------- */
async function boot() {
  route();
  let db = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      window.claude.use('sample').then(sm => { AI.sample = sm || null; if (S.view === 'prehled') scheduleRender(); }).catch(() => { AI.sample = null; });
      window.claude.use('downloads').then(d => { downloads = d; if (S.view === 'nastaveni') scheduleRender(); }).catch(() => {});
    }
  } catch (e) { db = null; }
  let id = null;
  if (db && user) { try { id = await user.id(); } catch (e) { id = null; } }
  if (db && id) startDb(db, id); else startLocal();
}
function startLocal() {
  if (standalone && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  S.target = 'local';
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('penizky:v1') || 'null'); } catch (e) { saved = null; }
  if (saved && saved.settings && saved.settings.onboarded) { S.mode = 'local'; S.settings = mergeSettings(saved.settings); S.txs = Array.isArray(saved.txs) ? saved.txs : []; if (migrateCats(S.settings)) saveLocal(); }
  else enterDemo();
  render();
}
function startDb(db, id) {
  S.target = 'db';
  const root = db.doc(`data/users/${id}/finance`);
  refs = { root, tx: root.collection('tx') };
  let gotS = false, gotT = false, remoteS = null, remoteT = [];
  const timer = setTimeout(() => { if (!gotS || !gotT) { S.stale = true; if (S.mode === 'loading') enterDemo(); scheduleRender(); } }, 10000);
  const settle = () => {
    if (!gotS || !gotT) return;
    clearTimeout(timer); S.stale = false;
    const has = (remoteS && remoteS.onboarded) || remoteT.length > 0;
    if (has) {
      S.mode = 'db';
      if (!settingsInFlight) { S.settings = mergeSettings(remoteS || { onboarded: true }); if (migrateCats(S.settings)) persistSettings(); }
      S.txs = remoteT;
    } else if (S.mode !== 'demo') enterDemo();
    scheduleRender();
  };
  root.onSnapshot(snap => { gotS = true; remoteS = snap.exists ? snap.data() : null; settle(); },
    err => { console.error(err); gotS = true; clearTimeout(timer); S.stale = true; settle(); scheduleRender(); });
  refs.tx.onSnapshot(q => { gotT = true; remoteT = q.docs.map(d => ({ ...d.data(), id: d.id })); settle(); },
    err => { console.error(err); gotT = true; clearTimeout(timer); S.stale = true; settle(); scheduleRender(); });
}
function startReal(income) {
  const st = DEFAULTS();
  st.onboarded = true; st.incomePlan = income;
  if (income > 0) st.recurring = [{ id: uid('r'), name: 'Výplata', amount: income, type: 'income', category: 'Mzda', day: startDay() }];
  S.settings = st; S.txs = []; S.mode = S.target; S.offset = 0;
  persistSettings();
  render();
  toast('Hotovo. Přidej svůj první výdaj nebo nastav pravidelné platby.');
}

/* ---------- routing & render scheduling ---------- */
function route() {
  const h = (location.hash || '').replace('#', '');
  S.view = VIEWS.includes(h) ? h : 'prehled';
  render();
}
window.addEventListener('hashchange', route);
function isEditing() {
  const a = document.activeElement;
  return !!(a && $('#view').contains(a) && a.matches('input:not([type=checkbox]):not([type=range]):not([type=file]), textarea'));
}
function scheduleRender() { if (isEditing()) { S.needsRender = true; return; } render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (S.needsRender && !isEditing()) { S.needsRender = false; render(); } }, 0));
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!isEditing()) drawCharts(); }, 150); });

    <div class="legend-row total"><span class="sw free" style="background:repeating-linear-gradient(135deg,var(--line-strong) 0 2px,transparent 2px 5px)"></span><span>${s.free >= 0 ? 'Volné peníze' : 'Chybí'}</span><span class="v" style="${s.free < 0 ? 'color:var(--crit)' : ''}">${money(s.free)}</span></div>`;

    <div class="row"><div class="dotc ty-${r.type}">${TYPES[r.type].short}</div>

  </div>`;
}
const dny = n => n === 1 ? 'den' : n >= 2 && n <= 4 ? 'dny' : 'dní';

function adviceHtml(p, s, em) {
  const items = [];
  const it = (lvl, sym, html) => items.push(`<li><span class="ic ${lvl}" aria-hidden="true">${sym}</span><span>${html}</span></li>`);
  if (s.expectedIncome <= 0 && !s.past) it('info', 'i', 'Zadej v <a href="#nastaveni">Nastavení</a> svůj čistý měsíční příjem nebo si přidej výplatu jako pravidelný příjem. Pak ti spočítám, kolik můžeš utratit.');
  if (!s.past && s.free < 0) it('crit', '!', `Plánované výdaje přesahují příjem o <b>${money(-s.free)}</b>. Omez výdaje nebo tento měsíc pošli méně na investice.`);
  const over = Object.entries(S.settings.budgets || {}).filter(([c, lim]) => num(lim) > 0 && (s.byCat[c] || 0) > num(lim));
  over.forEach(([c, lim]) => it('crit', '!', `${esc(c)}: překročeno o <b>${money(s.byCat[c] - num(lim))}</b> (limit ${money(lim)}).`));
  if (!s.past && !s.future && s.spendLimit > 0) {
    const elapsed = (p.days - s.daysLeft + 1) / p.days;
    const variable = s.expenses - S.txs.filter(t => t.recurringId && t.type === 'expense' && t.date >= p.s && t.date <= p.e).reduce((a, t) => a + num(t.amount), 0);
    const proj = variable / Math.max(elapsed, 0.05);
    const varLimit = s.spendLimit - (S.settings.recurring || []).filter(r => r.type === 'expense').reduce((a, r) => a + num(r.amount), 0);
    if (varLimit > 0 && elapsed > 0.15) {
      if (proj > varLimit * 1.05) it('warn', '↗', `Současným tempem utratíš za běžné věci asi <b>${money(proj)}</b>, ale vejde se ${money(varLimit)}. Hlídej si <b>${money(Math.max(0, s.perDay))} denně</b>.`);
      else it('ok', '✓', `Tempo utrácení je v pořádku. Za běžné věci směřuješ k ${money(proj)} z ${money(varLimit)}.`);
    }
  }
  if (em.target > 0 && em.cur < em.target) {
    const gap = em.target - em.cur;
    it('warn', '◔', `Rezerva pokryje <b>${em.months.toFixed(1).replace('.', ',')} měsíce</b> výdajů z doporučených ${S.settings.emergencyMonths}. Chybí ${money(gap)}. Dokud ji nedoplníš, dej spoření přednost před rizikovějšími investicemi.`);
  } else if (em.target <= 0 && !s.past) it('info', 'i', 'Přidej v <a href="#rozpocet">Rozpočtu</a> pravidelné platby jako nájem nebo energie. Pak spočítám, jak velkou rezervu potřebuješ, a budu hlídat limity.');
  else if (em.target > 0) it('ok', '✓', `Rezerva pokrývá ${em.months.toFixed(1).replace('.', ',')} měsíce výdajů. Volné peníze navíc můžeš klidně investovat.`);
  if (!s.past && s.investTarget > 0 && s.invested < s.investTarget) it('info', '→', `V tomto období ještě pošli na investice <b>${money(s.investTarget - s.invested)}</b> (${pct(S.settings.investPct)} z příjmu). <a href="#" data-act="add" data-type="invest" data-amount="${Math.round(s.investTarget - s.invested)}">Zapsat investici</a>`);
  if (!s.past && s.saveTarget > 0 && s.saved < s.saveTarget) it('info', '→', `Na spoření zbývá odložit <b>${money(s.saveTarget - s.saved)}</b>. <a href="#" data-act="add" data-type="save" data-amount="${Math.round(s.saveTarget - s.saved)}">Zapsat spoření</a>`);
  const owedOpen = s.debts.filter(d => d.dir === 'owed' && d.open);
  if (owedOpen.length) {
    const by = {}; owedOpen.forEach(d => { by[d.name] = (by[d.name] || 0) + d.remaining; });
    const top = Object.entries(by).sort((a, b) => b[1] - a[1]), total = top.reduce((a, x) => a + x[1], 0);
    it('info', '↩', `Ostatní ti dluží <b>${money(total)}</b> (${top.slice(0, 3).map(([n, v]) => `${esc(n)} ${money(v)}`).join(', ')}${top.length > 3 ? ', …' : ''}). Až ti peníze pošlou, označ je v sekci <a href="#dluhy">Půjčky a dluhy</a>.`);
  }
  s.debts.filter(d => d.dir === 'owe' && d.open && d.due).forEach(d => {
    const days = Math.round((pd(d.due) - pd(today())) / 864e5);
    if (days < 0) it('crit', '!', `${esc(d.name)}: dluh ${money(d.remaining)} je po splatnosti (${dm(pd(d.due))}).`);
    else if (days <= 14) it('warn', '!', `${esc(d.name)}: do ${dm(pd(d.due))} je potřeba vrátit ${money(d.remaining)}.`);
  });
  if (S.mode === 'local' && S.txs.length >= 20) {
    const lb = S.settings.lastBackup, age = lb ? Math.round((pd(today()) - pd(lb)) / 864e5) : null;
    if (age == null || age > 30) it('info', '↓', `Data máš jen v tomto zařízení. ${lb ? `Poslední záloha je ${age} dní stará.` : 'Zatím nemáš žádnou zálohu.'} <a href="#nastaveni">Stáhni si zálohu</a>, ať o ně nepřijdeš.`);
  }
  if (!items.length) it('ok', '✓', 'Všechno vypadá dobře. Nic dalšího k řešení.');
  return `<ul class="advice">${items.slice(0, 6).join('')}</ul>`;
}

function catBars(s) {
  const budgets = S.settings.budgets || {};
  const cats = new Set([...Object.keys(s.byCat), ...Object.keys(budgets).filter(c => num(budgets[c]) > 0)]);
  const rows = [...cats].map(c => ({ c, v: s.byCat[c] || 0, b: num(budgets[c]), up: s.upByCat[c] || 0 })).sort((a, b) => b.v - a.v);
  if (!rows.length) return `<div class="empty"><b>Žádné výdaje</b>V tomto období zatím nemáš zapsaný žádný výdaj.</div>`;
  const max = Math.max(...rows.map(r => Math.max(r.v, r.b))) || 1;
  return `<div class="bars">${rows.map(r => {
    const over = r.b > 0 && r.v > r.b;
    const tip = `${esc(r.c)}<br>Utraceno <b>${money(r.v)}</b>${r.b ? `<br>Limit ${money(r.b)}` : ''}${r.up ? `<br>Ještě čeká ${money(r.up)}` : ''}`;
    return `<div class="bar-row" data-tip="${esc(tip)}"><span class="name">${esc(r.c)} ${over ? `<span class="pill crit">Překročeno o ${money(r.v - r.b)}</span>` : ''}</span>
      <span class="val"><b>${money(r.v)}</b>${r.b ? ` / ${money(r.b)}` : ''}</span>
      <div class="track"><div class="fill ${over ? 'over' : ''}" style="width:${r.v / max * 100}%"></div>${r.b ? `<div class="mark" style="left:calc(${r.b / max * 100}% - 1px)"></div>` : ''}</div></div>`;
  }).join('')}</div>`;
}

function txRow(t) {
  const sign = cashSign(t);
  return `<div class="row click" data-act="edit-tx" data-id="${esc(t.id)}" role="button" tabindex="0">
    <div class="dotc ty-${t.type}" title="${TYPES[t.type].label}">${TYPES[t.type].short}</div>
    <div class="t"><div class="n">${esc(t.note || catName(t))}</div><div class="m">${esc(catName(t))} · ${dm(pd(t.date))}${t.recurringId ? ' · pravidelná' : ''}${t.offBudget ? ' · mimo rozpočet' : ''}${t.split ? ` · tvůj podíl ${money(expAmt(t))}, zbytek dluží ${(t.split.people || []).length} ${pl((t.split.people || []).length, 'člověk', 'lidé', 'lidí')}` : ''}</div></div>
    <div class="amt ${sign > 0 ? 'income' : t.type}">${money(sign * num(t.amount), true)}</div></div>`;
}

function viewTx(p) {
  const s = stats(p), f = S.filter;
  const allCats = [...new Set(s.list.map(t => catName(t)))].sort((a, b) => a.localeCompare(b, 'cs'));
  let list = s.list.filter(t => (f.type === 'all' || t.type === f.type) && (f.cat === 'all' || catName(t) === f.cat) && (!f.q || (`${t.note} ${catName(t)}`).toLowerCase().includes(f.q.toLowerCase())));
  list.sort((a, b) => b.date.localeCompare(a.date));
  const groups = {};
  list.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  const body = Object.keys(groups).length ? Object.entries(groups).map(([d, ts]) => {
    const net = ts.reduce((a, t) => a + (t.type === 'invest' || t.type === 'save' ? 0 : cashSign(t)) * num(t.amount), 0);
    const date = pd(d);
    return `<div class="day-head"><span>${['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'][date.getDay()]} ${dm(date)}</span><span class="num">${net ? money(net, true) : ''}</span></div>${ts.map(txRow).join('')}`;
  }).join('') : `<div class="empty"><b>Nic tu není</b>${s.list.length ? 'Žádná transakce neodpovídá filtru.' : 'V tomto období zatím nemáš žádné transakce. Můžeš je přidat ručně, nebo naimportovat z výpisu z banky.'}</div>`;
  const tot = t => list.filter(x => x.type === t && !x.offBudget).reduce((a, x) => a + (t === 'expense' ? expAmt(x) : num(x.amount)), 0);
  return `<div class="grid">
    <div class="span-12 stats">
      <div class="stat"><div class="k"><i style="background:var(--c-income)"></i>Příjmy</div><div class="v">${money(tot('income'))}</div></div>
      <div class="stat"><div class="k"><i style="background:var(--c-expense)"></i>Výdaje</div><div class="v">${money(tot('expense'))}</div></div>
      <div class="stat"><div class="k"><i style="background:var(--c-invest)"></i>Investice</div><div class="v">${money(tot('invest'))}</div></div>
      <div class="stat"><div class="k"><i style="background:var(--c-save)"></i>Spoření</div><div class="v">${money(tot('save'))}</div></div>
    </div>
    <section class="card span-12">
      <div class="card-head"><h2>Transakce · ${esc(p.label)}</h2><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="sub">${list.length} ${list.length === 1 ? 'položka' : list.length >= 2 && list.length <= 4 ? 'položky' : 'položek'}</span><button class="btn small" data-act="bank-import">Importovat výpis z banky</button></div></div>
      <div class="filters">
        <select class="in" id="fType" data-filter="type" aria-label="Typ">
          <option value="all">Všechny typy</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select>
        <select class="in" id="fCat" data-filter="cat" aria-label="Kategorie"><option value="all">Všechny kategorie</option>${allCats.map(c => `<option ${f.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        <input class="in" id="fQ" data-filter="q" placeholder="Hledat v poznámkách" value="${esc(f.q)}" aria-label="Hledat">
      </div>
      <div class="list" id="txList">${body}</div>
    </section></div>`;
}

function viewBudget(p) {
  const s = stats(p), st = S.settings;
  const budgets = st.budgets || {};
  const sumBudgets = st.expenseCats.reduce((a, c) => a + num(budgets[c.name]), 0);
  const recExp = (st.recurring || []).filter(r => r.type === 'expense');
  const recByCat = {}; recExp.forEach(r => recByCat[r.category] = (recByCat[r.category] || 0) + num(r.amount));
  const rows = st.expenseCats.map((c, ci) => {
    const spent = s.byCat[c.name] || 0, lim = num(budgets[c.name]);
    const w = lim > 0 ? Math.min(100, spent / lim * 100) : 0;
    const state = lim > 0 ? (spent > lim ? `<span class="pill crit">Přes o ${money(spent - lim)}</span>` : spent > lim * .85 ? `<span class="pill warn">Zbývá ${money(lim - spent)}</span>` : `<span class="pill ok">Zbývá ${money(lim - spent)}</span>`) : '<span class="pill neutral">Bez limitu</span>';
    return `<tr><td><div style="font-weight:500">${esc(c.name)}</div>${recByCat[c.name] ? `<div class="help">pravidelně ${money(recByCat[c.name])}</div>` : ''}</td>
      <td><button class="tog ${c.need ? 'need' : ''}" data-act="toggle-need" data-cat="${esc(c.name)}" aria-pressed="${c.need}">${c.need ? 'Nutnost' : 'Přání'}</button></td>
      <td class="r">${money(spent)}<div class="meter" style="min-width:90px"><span style="width:${w}%;background:${spent > lim && lim ? 'var(--crit)' : 'var(--c-expense)'}"></span></div></td>
      <td class="r"><input class="in num" id="b-${ci}" data-budget="${esc(c.name)}" inputmode="decimal" value="${lim || ''}" placeholder="—" aria-label="Limit ${esc(c.name)}"></td>
      <td>${state}</td></tr>`;
  }).join('');
  const limitNote = s.spendLimit > 0 ? (sumBudgets > s.spendLimit
    ? `<span class="pill crit">Součet limitů ${money(sumBudgets)} přesahuje, co můžeš utratit (${money(s.spendLimit)})</span>`
    : `<span class="help">Součet limitů ${money(sumBudgets)} z ${money(s.spendLimit)}, které můžeš utratit. Nerozpočtováno ${money(s.spendLimit - sumBudgets)}.</span>`) : '';

  const recRows = (st.recurring || []).length ? st.recurring.map(r => `<div class="row">
      <div class="dotc ty-${r.type}">${TYPES[r.type].short}</div>
      <div class="t"><div class="n">${esc(r.name)}</div><div class="m">${TYPES[r.type].label} · ${esc(r.type === 'save' ? catName({ type: 'save', category: r.category }) : r.type === 'debt' ? 'Splátka dluhu' : r.category)} · každý ${r.day}. den</div></div>
      <div style="display:flex;gap:6px;align-items:center"><span class="amt ${r.type}">${money(r.type === 'income' ? r.amount : -r.amount, true)}</span>
      <button class="btn small ghost danger" data-act="del-rec" data-id="${esc(r.id)}" aria-label="Smazat ${esc(r.name)}">Smazat</button></div></div>`).join('')
    : `<div class="empty"><b>Zatím žádné</b>Přidej nájem, výplatu, předplatné nebo pravidelnou investici. Započítají se dopředu do toho, kolik můžeš utratit.</div>`;

  const needs = Object.entries(s.byCat).reduce((a, [c, v]) => a + (isNeed(c) ? v : 0), 0) + Object.entries(s.upByCat).reduce((a, [c, v]) => a + (isNeed(c) ? v : 0), 0);
  const wants = Object.entries(s.byCat).reduce((a, [c, v]) => a + (isNeed(c) ? 0 : v), 0) + Object.entries(s.upByCat).reduce((a, [c, v]) => a + (isNeed(c) ? 0 : v), 0);
  const fut = s.invested + s.saved;
  const base = s.expectedIncome || 1;
  const rule = [
    { k: 'Nutnosti', v: needs, t: 50, d: 'bydlení, jídlo, doprava, zdraví' },
    { k: 'Přání', v: wants, t: 30, d: 'restaurace, zábava, nákupy' },
    { k: 'Investice a spoření', v: fut, t: 20, d: 'budoucí já' },
  ];
  const ruleHtml = rule.map(r => {
    const pc = r.v / base * 100;
    const ok = r.k === 'Investice a spoření' ? pc >= r.t : pc <= r.t;
    return `<div class="rule-row"><div><div style="font-weight:500">${r.k}</div><div class="help">${r.d}</div></div>
      <div class="track" data-tip="${r.k}: <b>${money(r.v)}</b> (${pct(pc)} příjmu)<br>Doporučeno ${r.t} % = ${money(base * r.t / 100)}"><div class="fill" style="width:${Math.min(100, pc)}%;${ok ? '' : 'background:var(--warn)'}"></div><div class="mark" style="left:calc(${r.t}% - 1px)"></div></div>
      <div class="num" style="text-align:right"><b>${pct(pc)}</b> <span class="help">/ ${r.t} %</span></div></div>`;
  }).join('');

  const typeOpts = Object.entries(TYPES).filter(([k]) => k !== 'debt').map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
  return `<div class="grid">
    <section class="card span-12"><div class="card-head"><h2>Limity kategorií</h2><span class="sub">${esc(p.label)} · limit platí pro každé období</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kategorie</th><th>Druh</th><th class="r">Utraceno</th><th class="r">Limit</th><th>Stav</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="margin-top:12px">${limitNote}</div></section>

    <section class="card span-7"><div class="card-head"><h2>Pravidelné platby a příjmy</h2><span class="sub">${money(recExp.reduce((a, r) => a + num(r.amount), 0))} fixních výdajů měsíčně</span></div>
      <div class="list">${recRows}</div>
      <form class="inline-form" data-form="add-rec">
        <div class="field"><label for="rName">Název</label><input class="in" id="rName" name="name" required placeholder="Nájem"></div>
        <div class="field"><label for="rType">Typ</label><select class="in" id="rType" name="type" data-rec-type>${typeOpts}</select></div>
        <div class="field"><label for="rCat">Kategorie</label><select class="in" id="rCat" name="category">${catsFor('expense').map(c => `<option value="${esc(c.v)}">${esc(c.l)}</option>`).join('')}</select></div>
        <div class="field"><label for="rAmt">Částka</label><input class="in num" id="rAmt" name="amount" inputmode="decimal" required placeholder="14 500"></div>
        <div class="field"><label for="rDay">Den v měsíci</label><input class="in num" id="rDay" name="day" type="number" min="1" max="28" value="1"></div>
        <button class="btn primary" type="submit">Přidat</button>
      </form></section>

    <section class="card span-5"><div class="card-head"><h2>Pravidlo 50/30/20</h2><span class="sub">z příjmu ${money(s.expectedIncome)}</span></div>
      ${ruleHtml}
      <p class="help" style="margin:10px 0 0">Orientační rozdělení příjmu: polovina na nutnosti, třetina na přání, pětina na budoucnost. Co je nutnost a co přání, přepneš u kategorie vlevo.</p></section>
  </div>`;
}

function viewInvest(p) {
  const s = stats(p), st = S.settings, em = emergency();
  const allInv = {}; let invTotal = 0;
  S.txs.forEach(t => { if (t.type === 'invest') { allInv[t.category] = (allInv[t.category] || 0) + num(t.amount); invTotal += num(t.amount); } });
  const monthly = Math.round(s.investTarget) || Math.round(avgInvest()) || 3000;
  const goals = st.goals.length ? st.goals.map(g => {
    const gi = goalInfo(g);
    const w = num(g.target) > 0 ? Math.min(100, gi.saved / num(g.target) * 100) : 0;
    return `<div class="goal"><div class="goal-top"><span class="n">${esc(g.name)}</span><span class="num"><b>${money(gi.saved)}</b> / ${money(g.target)}</span></div>
      <div class="meter" style="height:10px"><span style="width:${w}%;background:var(--c-save)"></span></div>
      <div class="goal-top"><span class="help">${gi.done ? 'Cíl splněn' : gi.monthly != null ? `Odkládej <b style="color:var(--ink)">${money(gi.monthly)} měsíčně</b> do ${dm(pd(g.deadline))} ${pd(g.deadline).getFullYear()}` : `Chybí ${money(gi.left)}`}</span>
      <span class="acts">${gi.done ? '' : `<button class="btn small" data-act="add" data-type="save" data-cat="${esc(g.id)}" data-amount="${Math.round(gi.monthly || 0) || ''}">Přispět</button>`}<button class="btn small ghost danger" data-act="del-goal" data-id="${esc(g.id)}">Smazat</button></span></div></div>`;
  }).join('') : `<div class="empty"><b>Žádné cíle</b>Na co spoříš? Dovolená, auto, vlastní bydlení. Přidej cíl a spočítám, kolik odkládat měsíčně.</div>`;
  const emW = em.target > 0 ? Math.min(100, em.cur / em.target * 100) : 0;
  const invCats = Object.entries(allInv).sort((a, b) => b[1] - a[1]);
  return `<div class="grid">
    <section class="card span-6"><div class="card-head"><h2>Kolik investovat</h2><span class="sub">${esc(p.label)}</span></div>
      <div class="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        <div class="tile"><div class="y">Cíl (${pct(st.investPct)} z příjmu)</div><div class="v">${money(s.investTarget)}</div></div>
        <div class="tile"><div class="y">Investováno</div><div class="v">${money(s.invested)}</div><div class="s">${s.invested >= s.investTarget ? 'Splněno' : `zbývá ${money(s.investTarget - s.invested)}`}</div></div>
      </div>
      <div class="meter" style="height:10px;margin-top:14px"><span style="width:${s.investTarget ? Math.min(100, s.invested / s.investTarget * 100) : 0}%;background:var(--c-invest)"></span></div>
      <p class="help" style="margin:12px 0">${em.cur < em.target ? `Rezerva zatím není kompletní, proto doporučuji část peněz směřovat nejdřív do ní (spoření ${pct(st.savePct)}).` : 'Rezervu máš hotovou, takže investice nebudeš muset prodávat ve špatnou chvíli.'} Procenta změníš v <a href="#nastaveni">Nastavení</a>.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="add" data-type="invest" data-amount="${Math.max(0, Math.round(s.investTarget - s.invested)) || ''}">Zapsat investici</button></div>
      ${invCats.length ? `<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:6px">Celkem vloženo · ${money(invTotal)}</div>${invCats.map(([c, v]) => `<div class="legend-row"><span class="sw" style="background:var(--c-invest);opacity:${.35 + .65 * v / invCats[0][1]}"></span><span>${esc(c)}</span><span class="v">${money(v)}</span></div>`).join('')}</div>` : ''}
    </section>

    <section class="card span-6"><div class="card-head"><h2>Finanční rezerva</h2><span class="sub">${st.emergencyMonths} měsíců výdajů</span></div>
      <div class="hero-num" style="font-size:36px;margin:0">${money(em.cur)}</div>
      <div class="help">z cílových ${money(em.target)} · průměrné měsíční výdaje ${money(em.monthly)}</div>
      <div class="meter" style="height:10px;margin-top:12px"><span style="width:${emW}%;background:var(--c-save)"></span></div>
      <p style="margin:12px 0 0">${em.target <= 0 ? 'Jakmile budeš mít zapsané výdaje, spočítám, jak velkou rezervu potřebuješ.' : em.cur >= em.target ? `<span class="pill ok">Hotovo</span> Rezerva pokryje ${em.months.toFixed(1).replace('.', ',')} měsíce bez příjmu.` : `Pokryje <b>${em.months.toFixed(1).replace('.', ',')} měsíce</b>. Chybí ${money(em.target - em.cur)}${s.saveTarget > 0 ? `, při spoření ${money(s.saveTarget)} měsíčně to máš za <b>${Math.ceil((em.target - em.cur) / s.saveTarget)} ${mes(Math.ceil((em.target - em.cur) / s.saveTarget))}</b>` : ''}.`}</p>
      <div style="margin-top:12px"><button class="btn" data-act="add" data-type="save" data-cat="rezerva">Odložit do rezervy</button></div>
    </section>

    <section class="card span-12"><div class="card-head"><h2>Investice a spoření v čase</h2><span class="sub">posledních 12 období</span></div>
      <div class="chart-legend"><span><i style="background:var(--c-invest)"></i>Investice</span><span><i style="background:var(--c-save)"></i>Spoření</span></div>
      <div class="chart" data-chart="invest"></div></section>

    <section class="card span-6"><div class="card-head"><h2>Spořicí cíle</h2></div>
      ${goals}
      <form class="inline-form" data-form="add-goal">
        <div class="field"><label for="gName">Cíl</label><input class="in" id="gName" name="name" required placeholder="Dovolená"></div>
        <div class="field"><label for="gTarget">Cílová částka</label><input class="in num" id="gTarget" name="target" inputmode="decimal" required placeholder="40 000"></div>
        <div class="field"><label for="gStart">Už mám</label><input class="in num" id="gStart" name="start" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="gDl">Do kdy</label><input class="in" id="gDl" name="deadline" type="date"></div>
        <button class="btn primary" type="submit">Přidat cíl</button>
      </form></section>

    <section class="card span-6"><div class="card-head"><h2>Co udělá pravidelné investování</h2><span class="sub">odhad složeného úročení</span></div>
      <div class="form-grid">
        <div class="field"><label for="pjMonthly">Měsíčně investuji</label><input class="in num" id="pjMonthly" inputmode="decimal" value="${monthly}" data-proj></div>

/* ---------- charts ---------- */
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; return [1, 1.2, 1.6, 2, 2.4, 3, 4, 5, 6, 8, 10].find(n => n >= f - 1e-9) * e; }
function topRounded(x, y, w, h, r) { if (h <= 0) return ''; r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function drawCharts() {
  document.querySelectorAll('[data-chart]').forEach(el => {
    const w = Math.max(280, el.clientWidth);
    const kind = el.dataset.chart;
    el.innerHTML = kind === 'burn' ? burnChart(w) : kind === 'trend' ? trendChart(w) : investChart(w);
  });
}
function axisY(W, H, m, max, fmt) {
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, y = m.t + (H - m.t - m.b) * (1 - i / 4);
    g += `<line class="${i === 0 ? 'base-l' : 'grid-l'}" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text x="${m.l - 8}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  return g;
}
function burnChart(W) {
  const p = period(S.offset), s = stats(p), H = 230, m = { t: 12, r: 12, b: 26, l: 52 };
  const td = today();
  const lastIdx = s.past ? p.days - 1 : s.future ? -1 : p.days - s.daysLeft;
  const daily = new Array(p.days).fill(0);
  s.list.forEach(t => { if (t.type === 'expense' && !t.offBudget) { const i = Math.round((pd(t.date) - p.start) / 864e5); if (i >= 0 && i < p.days) daily[i] += expAmt(t); } });
  const cum = []; let acc = 0; daily.forEach((v, i) => { acc += v; cum.push(acc); });
  const limit = Math.max(0, s.spendLimit);
  const max = niceMax(Math.max(limit, lastIdx >= 0 ? cum[lastIdx] : 0, 1) * 1.08);
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const x = i => m.l + (p.days === 1 ? 0 : i / (p.days - 1)) * iw;
  const y = v => m.t + ih * (1 - v / max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Kumulativní výdaje v období">${axisY(W, H, m, max, compact)}`;
  const ticks = [0, 7, 14, 21, p.days - 1].filter((v, i, a) => v < p.days && a.indexOf(v) === i && (v === p.days - 1 || p.days - 1 - v > 3));
  ticks.forEach(i => { const d = new Date(p.start.getFullYear(), p.start.getMonth(), p.start.getDate() + i, 12); svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === p.days - 1 ? 'end' : 'middle'}">${dm(d)}</text>`; });
  if (limit > 0) {
    svg += `<line x1="${x(0)}" y1="${y(0)}" x2="${x(p.days - 1)}" y2="${y(limit)}" stroke="var(--line-strong)" stroke-width="2"/>`;
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(limit)}" y2="${y(limit)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    svg += `<text x="${W - m.r}" y="${y(limit) - 6}" text-anchor="end" style="fill:var(--ink-2);font-weight:600">Limit ${money(limit)}</text>`;
  }
  if (lastIdx >= 0) {
    const pts = cum.slice(0, lastIdx + 1).map((v, i) => `${x(i)},${y(v)}`);
    svg += `<path d="M${x(0)},${y(0)} L${pts.join(' L')} L${x(lastIdx)},${y(0)} Z" fill="var(--c-expense)" opacity=".12"/>`;
    svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--c-expense)" stroke-width="2" stroke-linejoin="round"/>`;
    svg += `<circle cx="${x(lastIdx)}" cy="${y(cum[lastIdx])}" r="4.5" fill="var(--c-expense)" stroke="var(--surface)" stroke-width="2"/>`;
    const bw = iw / Math.max(1, p.days - 1);
    for (let i = 0; i <= lastIdx; i++) {
      const d = new Date(p.start.getFullYear(), p.start.getMonth(), p.start.getDate() + i, 12);
      const pace = limit * (p.days === 1 ? 1 : i / (p.days - 1));
      const tip = `<b>${dm(d)}</b><br>Utraceno celkem ${money(cum[i])}<br>Ten den ${money(daily[i])}${limit ? `<br>Rovnoměrné tempo ${money(pace)}` : ''}`;
      svg += `<g class="hit" data-tip="${esc(tip)}"><rect class="ht" x="${x(i) - bw / 2}" y="${m.t}" width="${bw}" height="${ih}"/><line class="cross" x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${m.t + ih}"/><circle class="dot" cx="${x(i)}" cy="${y(cum[i])}" r="4" fill="var(--c-expense)" stroke="var(--surface)" stroke-width="2"/></g>`;
    }
  } else svg += `<text x="${m.l + iw / 2}" y="${m.t + ih / 2}" text-anchor="middle" style="font-size:13px">Období ještě nezačalo</text>`;
  return svg + '</svg>';
}
function trendChart(W) {
  const H = 220, m = { t: 12, r: 8, b: 26, l: 52 };
  const ps = []; for (let o = S.offset - 5; o <= S.offset; o++) { const p = period(o); const s = stats(p); ps.push({ p, inc: s.income, exp: s.expenses }); }
  const max = niceMax(Math.max(1, ...ps.map(x => Math.max(x.inc, x.exp))) * 1.05);
  const iw = W - m.l - m.r, ih = H - m.t - m.b, gw = iw / ps.length;
  const bw = Math.min(26, (gw - 18) / 2);
  const y = v => m.t + ih * (1 - v / max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Příjmy a výdaje za posledních 6 období">${axisY(W, H, m, max, compact)}`;
  ps.forEach((d, i) => {
    const cx = m.l + gw * i + gw / 2;
    const bal = d.inc - d.exp;
    const tip = `<b>${esc(d.p.label)}</b><br>Příjmy ${money(d.inc)}<br>Výdaje ${money(d.exp)}<br>Rozdíl ${money(bal, true)}`;
    svg += `<g class="barhit" data-tip="${esc(tip)}"><rect class="bh" x="${m.l + gw * i + 2}" y="${m.t}" width="${gw - 4}" height="${ih}" rx="6"/>`;
    svg += `<path d="${topRounded(cx - bw - 1, y(d.inc), bw, y(0) - y(d.inc), 4)}" fill="var(--c-income)"/>`;
    svg += `<path d="${topRounded(cx + 1, y(d.exp), bw, y(0) - y(d.exp), 4)}" fill="var(--c-expense)"/>`;
    svg += `<text x="${cx}" y="${H - 6}" text-anchor="middle" style="${d.p.off === 0 ? 'fill:var(--ink);font-weight:600' : ''}">${esc(d.p.short)}</text></g>`;
  });
  return svg + '</svg>';
}
function investChart(W) {
  const H = 200, m = { t: 12, r: 8, b: 26, l: 52 };
  const ps = []; for (let o = S.offset - 11; o <= S.offset; o++) { const p = period(o); const s = stats(p); ps.push({ p, inv: s.invested, sav: s.saved }); }
  const max = niceMax(Math.max(1, ...ps.map(x => x.inv + x.sav)) * 1.05);
  const iw = W - m.l - m.r, ih = H - m.t - m.b, gw = iw / ps.length, bw = Math.min(30, gw - 8);
  const y = v => m.t + ih * (1 - v / max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Investice a spoření za 12 období">${axisY(W, H, m, max, compact)}`;
  ps.forEach((d, i) => {
    const x0 = m.l + gw * i + (gw - bw) / 2;
    const tip = `<b>${esc(d.p.label)}</b><br>Investice ${money(d.inv)}<br>Spoření ${money(d.sav)}<br>Celkem ${money(d.inv + d.sav)}`;
    svg += `<g class="barhit" data-tip="${esc(tip)}"><rect class="bh" x="${m.l + gw * i + 1}" y="${m.t}" width="${gw - 2}" height="${ih}" rx="6"/>`;
    const hInv = y(0) - y(d.inv), hSav = y(0) - y(d.sav);
    if (d.sav > 0 && d.inv > 0) {
      svg += `<rect x="${x0}" y="${y(d.inv)}" width="${bw}" height="${Math.max(0, hInv)}" fill="var(--c-invest)"/>`;
      svg += `<path d="${topRounded(x0, y(d.inv) - hSav, bw, Math.max(0, hSav - 2), 4)}" fill="var(--c-save)"/>`;
    } else if (d.inv > 0) svg += `<path d="${topRounded(x0, y(d.inv), bw, hInv, 4)}" fill="var(--c-invest)"/>`;
    else if (d.sav > 0) svg += `<path d="${topRounded(x0, y(d.sav), bw, hSav, 4)}" fill="var(--c-save)"/>`;
    if (i % (gw < 40 ? 2 : 1) === 0 || i === ps.length - 1) svg += `<text x="${m.l + gw * i + gw / 2}" y="${H - 6}" text-anchor="middle" style="${d.p.off === 0 ? 'fill:var(--ink);font-weight:600' : ''}">${esc(d.p.short)}</text>`;
    svg += '</g>';
  });

/* ---------- two-step confirm ---------- */

  btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = btn.dataset.orig; } }, 4000);
  return false;

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'close-sheet-bg') { if (e.target === el) closeSheet(); return; }
  if (el.tagName === 'A') e.preventDefault();
  const st = S.settings;
  switch (act) {
    case 'period': S.offset = el.dataset.d === '0' ? 0 : S.offset + Number(el.dataset.d); render(); break;
    case 'add': openSheet({ type: el.dataset.type, cat: el.dataset.cat, amount: el.dataset.amount }); break;
    case 'edit-tx': openSheet({ id: el.dataset.id }); break;
    case 'close-sheet': closeSheet(); break;
    case 'sheet-type': {
      const f = el.closest('form'); f.type.value = el.dataset.type;
      f.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b === el));
      $('#txCat').innerHTML = catOptions(el.dataset.type);
      $('#txCatLbl').textContent = el.dataset.type === 'debt' ? 'Dluh' : 'Kategorie';
      $('#splitBox').hidden = el.dataset.type !== 'expense'; break;
    }
    case 'del-tx': {
      if (!armed(el, 'Opravdu smazat?')) return;
      const id = el.closest('form').id.value; deleteTx(id);
      S.txs.filter(t => t.type === 'debt' && String(t.debtId || '').startsWith(`s:${id}:`)).forEach(t => deleteTx(t.id));
      closeSheet(); render(); toast('Transakce smazána'); break;

      else { const key = k === 'income' ? 'incomeCats' : 'investCats'; if (st[key].length <= 1) return toast('Aspoň jedna kategorie musí zůstat.'); st[key] = st[key].filter(c => c !== n); }

  } else if (standalone) {

    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();

function periodOffsetFor(date) {
  for (let o = -60; o <= 24; o++) { const p = period(o); if (date >= p.s && date <= p.e) return o; }
  return 0;
}

/* ---------- split bills, loans & debts ---------- */
// A split expense keeps the full paid amount (what left the account); the other people's shares become money owed to you.
// Debt payments are transactions of type "debt" linked by debtId to a loan in settings.debts or to one person's share of a split ("s:<txId>:<personId>").
let debtCache = null;
const splitOthers = t => (t.split && Array.isArray(t.split.people) ? t.split.people.reduce((a, p) => a + num(p.amount), 0) : 0);
const expAmt = t => Math.max(0, num(t.amount) - splitOthers(t));
function allDebts() {
  if (debtCache) return debtCache;
  const paid = {};
  S.txs.forEach(t => { if (t.type === 'debt') { const k = t.debtId || t.category; paid[k] = (paid[k] || 0) + num(t.amount); } });
  const out = [];
  (S.settings.debts || []).forEach(d => out.push({ ...d, src: 'manual', amount: num(d.amount), paid: paid[d.id] || 0 }));
  S.txs.forEach(t => {
    if (t.type !== 'expense' || !t.split || !Array.isArray(t.split.people)) return;
    t.split.people.forEach(p => {
      const id = `s:${t.id}:${p.id}`;
      out.push({ id, dir: 'owed', name: p.name, title: t.note || t.category, amount: num(p.amount), date: t.date, src: 'split', txId: t.id, paid: paid[id] || 0 });
    });
  });
  out.forEach(d => { d.remaining = Math.max(0, Math.round((d.amount - d.paid) * 100) / 100); d.open = d.remaining > 0.005; });
  debtCache = out;
  return out;
}
const findDebt = id => allDebts().find(d => d.id === id);
const debtLabel = d => `${d.dir === 'owed' ? 'Dluží mi' : 'Dlužím'}: ${d.name}${d.title ? ' – ' + d.title : ''} (zbývá ${money(d.remaining)})`;
function cashSign(t) {
  if (t.type === 'income') return 1;
  if (t.type === 'debt') { const d = findDebt(t.debtId || t.category); return d && d.dir === 'owed' ? 1 : -1; }
  return -1;
}
function payInstallment(id) {
  const d = findDebt(id); if (!d) return;
  const p = period(S.offset), td = today();
  const date = td >= p.s && td <= p.e ? td : dateInPeriod(p, d.day || 1);
  upsertTx({ id: uid('t'), date, type: 'debt', amount: Math.min(num(d.monthly) || d.remaining, d.remaining), category: d.id, debtId: d.id, note: 'Splátka: ' + d.name });
  render(); toast('Splátka zapsána');
}

/* pair already recorded incoming payments with the people who owe you */
function personDebts(key) {
  return allDebts().filter(d => d.dir === 'owed' && d.open && (norm(d.name) || '?') === key).sort((a, b) => a.date.localeCompare(b.date));
}
function pairCandidates(key, q) {
  const items = personDebts(key);
  if (!items.length) return [];
  const total = items.reduce((a, d) => a + d.remaining, 0);
  const from = ymd(new Date(pd(items[0].date).getTime() - 7 * 864e5));
  const tokens = norm(items[0].name).split(' ').filter(w => w.length >= 3);
  const nq = norm(q || '');
  return S.txs
    .filter(t => t.type === 'income' && t.date >= from && (!nq || norm(t.note + ' ' + money(num(t.amount))).includes(nq)))
    .map(t => {
      const n = norm(t.note || '');
      const nameHit = tokens.some(w => n.includes(w) || n.includes(w.slice(0, 4)));
      const a = num(t.amount);
      const amountHit = items.some(d => Math.abs(d.remaining - a) < 0.6) || Math.abs(total - a) < 0.6;
      return { t, nameHit, amountHit, score: (nameHit ? 2 : 0) + (amountHit ? 1 : 0) };
    })
    .sort((a, b) => b.score - a.score || b.t.date.localeCompare(a.t.date))
    .slice(0, 60);
}
function openPairSheet(key, q = '') {
  const items = personDebts(key);
  if (!items.length) { closeSheet(); return; }
  const name = items[0].name, total = items.reduce((a, d) => a + d.remaining, 0);
  const cands = pairCandidates(key, q);
  const rows = cands.length ? cands.map(({ t, nameHit, amountHit }) => `<div class="row">
      <div class="dotc ty-income">P</div>
      <div class="t"><div class="n">${esc(t.note || catName(t))}</div><div class="m">${dm(pd(t.date))} ${pd(t.date).getFullYear()}${nameHit ? ' · <span class="pill ok">jméno sedí</span>' : ''}${amountHit ? ' · <span class="pill ok">částka sedí</span>' : ''}</div></div>
      <div class="acts"><span class="amt income">${money(num(t.amount), true)}</span><button class="btn small primary" data-act="pair-link" data-key="${esc(key)}" data-id="${esc(t.id)}">Spárovat</button></div></div>`).join('')
    : `<div class="empty"><b>Žádná vhodná platba</b>${q ? 'Hledání nic nenašlo.' : 'Mezi příjmy od data dluhu není žádná platba. Naimportuj nejdřív výpis z banky.'}</div>`;
  $('#sheetRoot').innerHTML = `<div class="scrim" data-act="close-sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pairTitle">
    <div class="sheet-head"><h2 id="pairTitle">Spárovat platbu · ${esc(name)}</h2><button class="icon-btn" data-act="close-sheet" aria-label="Zavřít">✕</button></div>
    <p class="help" style="margin:-6px 0 10px">${esc(name)} ti dluží ${money(total)}. Vyber příchozí platbu, která k tomuto dluhu patří. Platba se přestane počítat jako příjem a sníží dluh. Když je vyšší než dluh, zbytek zůstane jako příjem.</p>
    <input class="in" id="pairQ" data-pair-key="${esc(key)}" placeholder="Hledat podle jména nebo částky" value="${esc(q)}" aria-label="Hledat platbu" style="margin-bottom:8px">
    <div class="list" style="max-height:55vh;overflow:auto">${rows}</div>
  </div></div>`;
}
function linkPayment(txId, key) {
  const tx = S.txs.find(t => t.id === txId);
  const items = personDebts(key);
  if (!tx || !items.length) return;
  let left = num(tx.amount);
  const pieces = [];
  for (const d of items) { if (left <= 0.005) break; const a = Math.round(Math.min(left, d.remaining) * 100) / 100; pieces.push({ d, a }); left = Math.round((left - a) * 100) / 100; }
  pieces.forEach((pc, i) => {
    const base = { date: tx.date, type: 'debt', category: pc.d.id, debtId: pc.d.id, amount: pc.a, note: tx.note || ('Vráceno: ' + pc.d.name) };
    if (i === 0) { const t = { ...tx, ...base }; delete t.recurringId; delete t.split; upsertTx(t); }
    else upsertTx({ id: uid('t'), ...base });
  });
  if (left > 0.005) upsertTx({ id: uid('t'), date: tx.date, type: 'income', category: tx.category, amount: left, note: (tx.note || '') + ' (zbytek po vrácení dluhu)' });
  const paired = pieces.reduce((a, p) => a + p.a, 0);
  toast(`Spárováno ${money(paired)} s dluhem ${items[0].name}${left > 0.005 ? `, ${money(left)} zůstává jako příjem` : ''}`);
  render();
  if (personDebts(key).length) openPairSheet(key); else closeSheet();
}

/* debt-aware import guess: a payment from someone who owes you, or a loan installment */
function guessDebt(note, amt, left) {
  const n = norm(note), a = Math.abs(amt);
  const rem = d => (left[d.id] ?? d.remaining);
  const nameHit = d => norm(d.name).split(' ').filter(w => w.length >= 3).some(w => n.includes(w));
  const open = allDebts().filter(d => d.open && rem(d) > 0.5);
  let pick = null;
  if (amt > 0) pick = open.find(d => d.dir === 'owed' && nameHit(d) && a <= rem(d) + 0.5);
  else pick = open.find(d => d.dir === 'owe' && ((num(d.monthly) > 0 && Math.round(num(d.monthly)) === Math.round(a)) || (nameHit(d) && Math.abs(rem(d) - a) < 0.5)));
  if (pick) left[pick.id] = rem(pick) - a;
  return pick ? pick.id : null;
}

function md(src) {
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g, '$1<i>$2</i>');
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  esc(src).split('\n').forEach(raw => {
    const l = raw.trimEnd(); let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^#{1,6}\s+(.*)/))) { close(); html += `<h4>${inline(m[1])}</h4>`; }
    else if (!l.trim()) close();
    else { close(); html += `<p>${inline(l)}</p>`; }
  });
  close();
  return html;
}

  wb.SheetNames.forEach(n => {
    const ws = wb.Sheets[n];
    if (!ws || !ws['!ref']) return;
    const rg = X.utils.decode_range(ws['!ref']);
    const rows = [];
    for (let r = rg.s.r; r <= rg.e.r; r++) {
      const row = [];
      for (let c = rg.s.c; c <= rg.e.c; c++) {
        const cell = ws[X.utils.encode_cell({ r, c })];
